# Baut die Oberfläche und veröffentlicht sie auf GitHub Pages.
#
# Läuft automatisch bei jedem Push auf "main" und lässt sich zusätzlich
# von Hand auslösen (Reiter "Actions" -> "Run workflow").
#
# Einmalig nötig: Settings -> Pages -> Source auf "GitHub Actions" stellen.

name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die der Workflow braucht, um auf Pages zu schreiben.
permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur eine Veröffentlichung gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Oberfläche bauen
        run: npm run build
        env:
          # Adresse des Cloudflare-Workers, mit "/api" am Ende. Sie steht unter
          # Settings -> Secrets and variables -> Actions -> Variables und ist
          # bewusst eine Variable, kein Secret: Sie steht ohnehin im gebauten
          # JavaScript und ist nichts Geheimes. Fehlt sie, wird wie bisher eine
          # Oberfläche ohne erreichbare API gebaut.
          VITE_API_BASIS: ${{ vars.VITE_API_BASIS }}

      - name: Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf Pages schalten
        id: deployment
        uses: actions/deploy-pages@v5
