# Baut die Oberfläche und veröffentlicht sie auf GitHub Pages.
#
# Läuft automatisch bei jedem Push auf "main" und lässt sich zusätzlich
# von Hand auslösen (Reiter "Actions" -> "Run workflow").
#
# Einmalig nötig: Settings -> Pages -> Source auf "GitHub Actions" stellen.

name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die der Workflow braucht, um auf Pages zu schreiben.
permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur eine Veröffentlichung gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Oberfläche bauen
        run: npm run build

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veröffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf Pages schalten
        id: deployment
        uses: actions/deploy-pages@v4
